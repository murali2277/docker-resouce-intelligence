version: "3.8"

services:
  dri-agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: dri-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dri-data:/var/lib/dri
      - ../config/config.yaml:/app/config/config.yaml:ro
    environment:
      DRI_LOG_LEVEL: "INFO"
      DRI_CONFIG: "/app/config/config.yaml"
    networks:
      - dri-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Prometheus for metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: dri-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - dri-network
    depends_on:
      - dri-agent

  # ---------------------------------------------------------------------------
  # Optional: TimescaleDB (time-series Postgres extension)
  #
  # Activate with:  docker compose --profile timescale up
  #
  # Then update config/config.yaml:
  #   storage:
  #     timescaledb_enabled: true
  #     timescaledb_url: "postgresql://dri:secret@timescaledb:5432/dri"
  #
  # Also install asyncpg in the DRI container:
  #   pip install "docker-resource-intelligence[timescaledb]"
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    profiles: ["timescale"]
    container_name: dri-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: dri
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: dri
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - dri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dri -d dri"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  dri-data:
  prometheus-data:
  timescaledb-data:

networks:
  dri-network:
    driver: bridge
