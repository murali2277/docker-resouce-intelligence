[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-resource-intelligence"
version = "0.1.0"
description = "Lightweight intelligent monitoring and self-healing agent for Docker container resource optimization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "DevOps Team", email = "devops@example.com"}
]
keywords = ["docker", "monitoring", "resource-management", "self-healing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "prometheus-client>=0.18.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]
perf = ["uvloop>=0.19.0"]
influxdb = ["influxdb-client>=1.18.0"]
forecasting = ["statsmodels>=0.14.0"]
timescaledb = ["asyncpg>=0.29.0"]

[project.urls]
Homepage = "https://github.com/murali2277/docker-resouce-intelligence"
Repository = "https://github.com/murali2277/docker-resouce-intelligence.git"
Documentation = "https://github.com/murali2277/docker-resouce-intelligence/tree/main/docs"

[tool.setuptools]
packages = ["dri"]
package-dir = {"" = "src"}

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
exclude = ".git,__pycache__,dist,build"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
markers = [
    "asyncio: mark test as asyncio",
]
